<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ABDESSAMAD | Portfolio</title>
    
    <!-- THIS IS THE LINK THAT DOWNLOADS THE MONTSERRAT FONT FROM GOOGLE -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700;900&display=swap" rel="stylesheet">

    <style>
        /* --- BASIC RESET & DARK THEME --- */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        html {
            scroll-behavior: smooth; 
        }
        body {
            /* We apply Montserrat to the whole body here */
            font-family: 'Montserrat', sans-serif;
            background-color: #0a0a0a; 
            color: #f0f0f0; 
            line-height: 1.6;
            font-size: 0.95rem; /* This makes your normal typing smaller/standard */
            font-weight: 400; /* Regular weight for normal text */
        }
        a {
            text-decoration: none;
            color: inherit;
        }

        /* --- NAVIGATION (Centered) --- */
        nav {
            display: flex;
            justify-content: center; /* This centers the name */
            align-items: center;
            padding: 25px 5%;
            position: sticky;
            top: 0;
            background-color: rgba(10, 10, 10, 0.95);
            z-index: 100;
            border-bottom: 1px solid #222;
        }
        .logo {
            font-size: 1.8rem;
            font-weight: 900; /* 900 is the boldest version of Montserrat */
            letter-spacing: 4px;
            text-transform: uppercase; /* Forces ALL CAPS */
        }

        /* --- HERO SECTION --- */
        .hero {
            height: 70vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 0 20px;
        }
        .hero h1 {
            font-size: 2.5rem;
            font-weight: 700; /* Bold */
            letter-spacing: 2px;
            margin-bottom: 20px;
            text-transform: uppercase; /* ALL CAPS */
        }
        .hero p {
            color: #888;
            max-width: 600px;
        }

        /* --- PORTFOLIO GRID --- */
        .portfolio-grid {
            padding: 50px 5%;
        }
        .section-title {
            text-align: center;
            font-size: 1.5rem;
            font-weight: 700; /* Bold */
            letter-spacing: 2px;
            margin-bottom: 40px;
            text-transform: uppercase; /* ALL CAPS */
        }
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
        }
        .grid-item {
            position: relative;
            overflow: hidden;
            cursor: pointer;
            border: 1px solid #222;
        }
        .grid-item img {
            width: 100%;
            height: 300px;
            object-fit: cover;
            display: block;
            transition: transform 0.4s ease, opacity 0.4s ease;
        }
        .grid-item:hover img {
            transform: scale(1.05);
            opacity: 0.7;
        }
        .grid-item .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background: rgba(0, 0, 0, 0.4);
            opacity: 0;
            transition: opacity 0.3s;
        }
        .grid-item:hover .overlay {
            opacity: 1;
        }
        .overlay span {
            font-size: 1rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 2px;
            border: 1px solid #fff;
            padding: 10px 20px;
        }

        /* --- VIDEO CATEGORY SECTIONS --- */
        .category-section {
            padding: 80px 5%;
            border-top: 1px solid #222;
        }
        .category-section h2 {
            font-size: 1.8rem;
            font-weight: 700; /* Bold */
            letter-spacing: 2px;
            margin-bottom: 10px;
            text-transform: uppercase; /* ALL CAPS */
        }
        .category-section p {
            color: #888;
            margin-bottom: 30px;
            max-width: 600px;
        }
        .video-container {
            position: relative;
            padding-bottom: 56.25%; 
            height: 0;
            background-color: #111;
            border: 1px solid #333;
        }
        .video-container iframe {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: none;
        }

        /* --- FOOTER --- */
        footer {
            text-align: center;
            padding: 40px 20px;
            border-top: 1px solid #222;
            color: #555;
            font-size: 0.85rem;
        }
    </style>
</head>
<body>

    <!-- CENTERED HEADER -->
    <nav>
        <div class="logo">ABDESSAMAD</div>
    </nav>

    <!-- HERO SECTION -->
    <section class="hero">
        <h1>Visual Storyteller</h1>
        <p>I create cinematic videos and compelling visual content. Scroll down to explore my work by category.</p>
    </section>

    <!-- CLICKABLE PORTFOLIO GRID -->
